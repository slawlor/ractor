[package]
name = "ractor_cluster"
version.workspace = true
authors = ["Sean Lawlor <slawlor>"]
description = "Distributed cluster environment of Ractor actors"
documentation = "https://docs.rs/ractor"
license = "MIT"
edition = "2021"
keywords = ["actor", "ractor", "cluster"]
repository = "https://github.com/slawlor/ractor"
readme = "README.md"
homepage = "https://github.com/slawlor/ractor"
categories = ["asynchronous"]
build = "src/build.rs"
rust-version.workspace = true

[features]
monitors = ["ractor/monitors"]
message_span_propogation = ["ractor/message_span_propogation"]
async-trait = ["dep:async-trait", "ractor/async-trait"]

default = ["message_span_propogation"]

[build-dependencies]
protoc-bin-vendored = "3"
prost-build = { version = "0.14" }

[dependencies]
## Required dependencies
bytes = { version = "1" }
prost = { version = "0.14" }
prost-types = { version = "0.14" }
ractor = { version = "0.16.0", default-features = false, features = ["tokio_runtime", "cluster"], path = "../ractor" }
ractor_cluster_derive = { version = "0.16.0", path = "../ractor_cluster_derive" }
rand = "0.10"
socket2 = { version = "0.6", features = ["all"] }
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net", "io-util", "tracing"]}
tokio-rustls = { version = "0.26" }
tracing = "0.1"
## Optional dependencies
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
criterion = "0.7"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "net", "io-util", "rt-multi-thread"] }

[[bench]]
name = "message_serialization"
harness = false
