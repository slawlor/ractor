name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown

      - name: Check workspace defaults and all targets
        run: cargo check --workspace --all-targets

      - name: Check async traits with Tokio
        run: cargo check --package ractor --features async-trait

      - name: Check async traits with async-std
        run: cargo check --package ractor --no-default-features --features async-std,async-trait

      - name: Check optional ractor APIs
        run: cargo check --package ractor --features cluster,monitors,blanket_serde,output-port-v2

      - name: Check ractor_cluster with async traits
        run: cargo check --package ractor_cluster --features async-trait

      - name: Check the ractor WASM library
        run: cargo check --package ractor --lib --target wasm32-unknown-unknown

  test:
    name: ${{matrix.name}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Run the default tests
            package: ractor
            # flags:
          - name: Test ractor with async-trait
            package: ractor
            flags: -F async-trait
          - name: Test ractor without span propogation
            package: ractor
            flags: --no-default-features -F tokio_runtime
          - name: Test ractor with the `cluster` feature
            package: ractor
            flags: -F cluster
          - name: Test ractor with the `blanket_serde` feature
            package: ractor
            flags: -F blanket_serde
          - name: Test ractor with async-std runtime
            package: ractor
            flags: --no-default-features -F async-std,message_span_propogation
          - name: Test ractor with async-std runtime but no span propagation
            package: ractor
            flags: --no-default-features -F async-std
          - name: Test ractor with async-std runtime and async-trait
            package: ractor
            flags: --no-default-features -F async-std,async-trait
          - name: Test ractor_cluster with native async traits
            package: ractor_cluster
            # flags:
          - name: Test ractor_cluster without message span propagation
            package: ractor_cluster
            flags: --no-default-features
            verify_no_span: true
          - name: Test ractor_cluster with async_trait
            package: ractor_cluster
            flags: -F async-trait
          - name: Test ractor with the monitor API
            package: ractor
            flags: -F monitors
          - name: Test ractor with output-port-v2 feature
            package: ractor
            flags: -F output-port-v2
          - name: Test ractor without output-port-v2 feature (explicit)
            package: ractor
            flags: --no-default-features -F tokio_runtime,message_span_propogation

    steps:
      - uses: actions/checkout@main

      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: ${{matrix.name}}
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --package ${{matrix.package}} ${{matrix.flags}}

      - name: Verify message span propagation is disabled
        if: matrix.verify_no_span
        shell: bash
        run: |
          if cargo tree --package ractor_cluster --no-default-features --edges features --invert ractor \
            | grep -Fq 'ractor feature "message_span_propogation"'; then
            echo 'ractor/message_span_propogation was unexpectedly enabled' >&2
            exit 1
          fi

      - name: Test everything
        uses: actions-rs/cargo@v1
        with:
          command: test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Install minimal stable with clippy
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: clippy
          override: true

      - name: Run Clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all -- -D clippy::all -D warnings

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Install minimal stable with rustfmt
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt
          override: true

      - name: Run rustfmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Install minimal stable with rustfmt
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt
          override: true

      - name: Run cargo doc on release profile
        uses: actions-rs/cargo@v1
        with:
          command: doc
          args: --lib -r

  benches:
    name: benches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Compile benchmarks
        uses: actions-rs/cargo@v1
        with:
          command: bench
          args: --no-run
